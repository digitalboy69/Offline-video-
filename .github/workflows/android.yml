name: Build OffScroll APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug + release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          sdkmanager "platforms;android-36.1" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # The debug signing config in app/build.gradle.kts expects ./debug.keystore (password "android").
      # It is git-ignored, so CI recreates it on every run.
      - name: Create debug keystore
        run: |
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Release signing uses ./my-upload-key.jks with alias "upload" (see app/build.gradle.kts).
      # If you add the repo secrets (see README), your key is used. Otherwise a generated CI key is used.
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$GITHUB_WORKSPACE/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            STORE_PW="$SECRET_STORE_PASSWORD"
            KEY_PW="${SECRET_KEY_PASSWORD:-$SECRET_STORE_PASSWORD}"
            echo "Using the release keystore from secrets."
          else
            STORE_PW="offscroll-ci"
            KEY_PW="offscroll-ci"
            keytool -genkeypair -keystore "$KS" -storepass "$STORE_PW" -keypass "$KEY_PW" \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OffScroll CI,O=OffScroll,C=US"
            echo "No release secrets set: using a generated CI key (fine for sideloading, not for the Play Store)."
          fi
          echo "STORE_PASSWORD=$STORE_PW" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OffScroll-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/OffScroll-release.apk
          ls -lh dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OffScroll-debug-apk
          path: dist/OffScroll-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OffScroll-release-apk
          path: dist/OffScroll-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OffScroll-debug.apk
            dist/OffScroll-release.apk
          generate_release_notes: true
